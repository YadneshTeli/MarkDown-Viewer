name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build & Release iOS
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build iOS (No Sign)
        run: flutter build ios --release --no-codesign

      - name: Archive iOS Payload
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r app-release.ipa Payload
          rm -rf Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: app-release.ipa

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Android Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ios-release

      - name: Extract Changelog Summary
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Extract first non-empty line after the version heading as the summary
          SUMMARY=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^### /{print; exit}" CHANGELOG.md)
          CHANGELOG_URL="https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md#${VERSION//.}"
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          echo "url=$CHANGELOG_URL" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            **/app-release.apk
            **/app-release.aab
            app-release.ipa
          body: |
            ${{ steps.changelog.outputs.summary }}

            📋 **[View full changelog](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)**
